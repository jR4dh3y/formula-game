name: Build and publish release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ASSET_ARCHIVE_URL: https://github.com/jR4dh3y/formula-game/releases/download/assets-68ae3a48b726ffa5/f1-racecraft-assets.zip
  ASSET_ARCHIVE_SHA256: 68ae3a48b726ffa5789ca049ebc438e77db8aca6fa91a46755c1376ae4053e7d
  LIVERY_ARCHIVE_URL: https://github.com/jR4dh3y/formula-game/releases/download/liveries-0a14081c2385c999/f1-racecraft-liveries.zip
  LIVERY_ARCHIVE_SHA256: 0a14081c2385c99923169c91a1daadd8a3e28d632bde82e104bf025c29c7c911

jobs:
  build-linux:
    name: Linux AppImages
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: "3"
    steps:
      - name: Install Linux build dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm --needed \
            alsa-lib alsa-plugins binutils cmake curl git gnupg libx11 libxcb \
            libxcursor libxext libxfixes libxi libxinerama libxkbcommon \
            libxkbcommon-x11 libxrandr libxrender nodejs pkgconf python rustup \
            squashfs-tools systemd-libs unzip vulkan-headers vulkan-icd-loader \
            wayland zstd

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Check tag matches Cargo version
        if: github.event_name == 'push'
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME must match workspace version $version" >&2
            exit 1
          fi

      - name: Download and unpack game assets
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            "$ASSET_ARCHIVE_URL" --output "$RUNNER_TEMP/f1-assets.zip"
          python tools/package/extract_assets.py "$RUNNER_TEMP/f1-assets.zip" "$RUNNER_TEMP/game-assets/assets" --sha256 "$ASSET_ARCHIVE_SHA256"
          curl --fail --location --retry 3 --retry-all-errors \
            "$LIVERY_ARCHIVE_URL" --output "$RUNNER_TEMP/f1-liveries.zip"
          python tools/package/overlay_assets.py "$RUNNER_TEMP/f1-liveries.zip" "$RUNNER_TEMP/game-assets/assets" --sha256 "$LIVERY_ARCHIVE_SHA256" --replace cars/gen22/liveries

      - name: Build normal and experimental AppImages
        run: |
          export F1_PACKAGE_ASSETS="$RUNNER_TEMP/game-assets/assets"
          python tools/package/build_appimage.py
          python tools/package/build_appimage.py --exp

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-x86_64
          path: dist/*
          compression-level: 0
          if-no-files-found: error

  build-windows:
    name: Windows portable EXE
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install MinGW-w64
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          suppress-deprecation-warnings: msystem-mingw64
          update: true
          install: >-
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc

      - name: Install stable Rust and Windows GNU target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Check tag matches Cargo version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])"
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME must match workspace version $version"
          }

      - name: Download and unpack game assets
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'f1-assets.zip'
          Invoke-WebRequest -Uri $env:ASSET_ARCHIVE_URL -OutFile $archive
          python tools/package/extract_assets.py $archive (Join-Path $env:RUNNER_TEMP 'game-assets/assets') --sha256 $env:ASSET_ARCHIVE_SHA256
          $liveries = Join-Path $env:RUNNER_TEMP 'f1-liveries.zip'
          Invoke-WebRequest -Uri $env:LIVERY_ARCHIVE_URL -OutFile $liveries
          python tools/package/overlay_assets.py $liveries (Join-Path $env:RUNNER_TEMP 'game-assets/assets') --sha256 $env:LIVERY_ARCHIVE_SHA256 --replace cars/gen22/liveries

      - name: Build the portable EXE
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          F1_PACKAGE_ASSETS: ${{ runner.temp }}/game-assets/assets
        run: |
          $env:PATH = "$env:MSYS2_LOCATION\mingw64\bin;$env:PATH"
          python tools/package/build_windows.py

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-x86_64
          path: dist/*
          compression-level: 0
          if-no-files-found: error

  publish-release:
    name: Attach packages to GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-linux-x86_64
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: release-windows-x86_64
          path: dist

      - name: Create combined checksums
        shell: bash
        run: |
          cd dist
          sha256sum \
            F1-Racecraft-*-linux-x86_64.AppImage \
            F1-Racecraft-*-windows-x86_64.exe > SHA256SUMS

      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$(gh release view "$TAG" --repo "$REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" == "true" ]]; then
            gh release delete "$TAG" --repo "$REPOSITORY" --yes
          fi
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; published assets are immutable. Use a new version tag." >&2
            exit 1
          else
            flags=()
            if [[ "$TAG" == *-* ]]; then
              flags+=(--prerelease --latest=false)
            fi
            gh release create "$TAG" dist/* \
              --repo "$REPOSITORY" \
              --title "F1 Racecraft $TAG" \
              --generate-notes \
              --draft \
              --verify-tag "${flags[@]}"
            gh release edit "$TAG" --repo "$REPOSITORY" --draft=false "${flags[@]}"
          fi
