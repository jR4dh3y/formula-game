[package]
name = "f1-the-game"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["3d", "png", "jpeg", "bevy_audio", "wav"] }
bevy_egui = { version = "0.43.1", default-features = false, features = ["render"] }
racecraft-sim = { path = "../sim" }
glam = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# `cargo run --release -p f1-the-game --features profile` writes a Chrome trace
# (trace-*.json) of every system and render pass; open it in ui.perfetto.dev.
profile = ["bevy/trace_chrome"]
